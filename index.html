<!DOCTYPE html>
<html lang="en" style="width:100%;height:100%;background:#000;">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-fullscreen"/>
<meta name="theme-color" content="#031b3a"/>
<title>HZ MC</title>
<!-- Resize first: your current favicon.png is ~950 KB.
     convert favicon.png -resize 192x192 -strip favicon-192.png && oxipng -o4 favicon-192.png -->
<link rel="icon" type="image/png" href="favicon-192.png"/>
<link rel="apple-touch-icon" href="favicon-192.png"/>
<style>
  html,body{
    margin:0;width:100%;height:100%;overflow:hidden;background:#000;
    overscroll-behavior:none;touch-action:none;
    -webkit-user-select:none;user-select:none;
    -webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  }
  canvas{display:block;outline:none}
  #hzmc-hud{position:fixed;top:4px;right:8px;z-index:9999;pointer-events:none;
    color:#0f0;font:12px/1.2 monospace;text-align:right;text-shadow:0 0 2px #000}
</style>

<script>
"use strict";
/* =====================================================================
   1. Device tier detection + resolution scaling (runs BEFORE classes.js)
   URL overrides:  ?q=low|mid|high   ?dpr=0.75   ?hud=1   ?jorbis=1
   ===================================================================== */
(function () {
  var qs = new URLSearchParams(location.search);
  var ua = navigator.userAgent;
  var touch = (navigator.maxTouchPoints || 0) > 1;
  var mobile = /Android|iPhone|iPad|iPod|Mobile/i.test(ua) || (/Macintosh/.test(ua) && touch); // iPadOS reports as Mac
  var cores = navigator.hardwareConcurrency || 4;
  var mem = navigator.deviceMemory || (mobile ? 3 : 8);   // deviceMemory is Chromium-only

  // Detect software rendering (Safari masks the GPU string, which is fine: it just stays "")
  var gpu = "";
  try {
    var c = document.createElement("canvas");
    var g = c.getContext("webgl2") || c.getContext("webgl");
    if (g) {
      var x = g.getExtension("WEBGL_debug_renderer_info");
      if (x) gpu = String(g.getParameter(x.UNMASKED_RENDERER_WEBGL));
      var l = g.getExtension("WEBGL_lose_context");
      if (l) l.loseContext();
    }
  } catch (e) {}
  var software = /SwiftShader|llvmpipe|Software|Basic Render/i.test(gpu);

  var tier = qs.get("q");
  if (tier !== "low" && tier !== "mid" && tier !== "high") {
    tier = (software || mem <= 2 || cores <= 2) ? "low"
         : (mobile || mem <= 4 || cores <= 4)   ? "mid"
         : "high";
  }

  // Render-resolution multiplier. Eagler sizes its canvas as CSS size * devicePixelRatio,
  // so overriding DPR scales the real framebuffer while CSS stretches it to the screen.
  var native = window.devicePixelRatio || 1;
  var cfg = {
    low:  { min: 0.5,  max: 0.75, start: 0.5 },
    mid:  { min: 0.5,  max: 1.25, start: 1.0 },
    high: { min: 0.75, max: Math.max(0.75, Math.min(native, 2)), start: Math.max(0.75, Math.min(native, 1.5)) }
  }[tier];

  var ALL = [0.5, 0.625, 0.75, 0.875, 1, 1.25, 1.5, 1.75, 2];
  var steps = ALL.filter(function (s) { return s >= cfg.min - 1e-6 && s <= cfg.max + 1e-6; });
  if (!steps.length) steps = [cfg.start];

  function nearest(v) {
    var best = 0;
    for (var i = 1; i < steps.length; i++) if (Math.abs(steps[i] - v) < Math.abs(steps[best] - v)) best = i;
    return best;
  }

  var saved = NaN;
  try { saved = parseFloat(localStorage.getItem("hzmc.dpr." + tier)); } catch (e) {}
  var forced = parseFloat(qs.get("dpr"));
  var idx = nearest(!isNaN(forced) ? forced : (!isNaN(saved) ? saved : cfg.start));
  var maxIdx = steps.length - 1;
  var dpr = !isNaN(forced) ? forced : steps[idx];

  try {
    Object.defineProperty(window, "devicePixelRatio", { configurable: true, get: function () { return dpr; } });
  } catch (e) { console.warn("[HZMC] cannot override devicePixelRatio", e); }

  /* ---------------------------------------------------------------
     Engine launch options. Only keys that exist in YOUR classes.js.
     --------------------------------------------------------------- */
  window.eaglercraftXOpts = {
    container: "game_frame",
    assetsURI: "assets.epk",          // append ?v=<build> when you update so immutable caching stays safe
    worldsDB: "worlds",
    demoMode: false,
    crashOnUncaughtExceptions: false,
    useVisualViewport: mobile,        // correct sizing with iOS/Android browser bars + keyboard
    useJOrbisAudioDecoder: qs.has("jorbis"), // only if audio is silent on a device (Java OGG decoder; slower)
    // forceWebGL2 / singleThreadMode / ramdiskMode intentionally NOT set: see notes in the guide
    // servers: [{ addr: "wss://your.server/", name: "My Server" }],   // ws://localhost is the *device itself* on a phone/tablet
    relays: [
      { addr: "wss://relay.deev.is/", primary: true },
      { addr: "wss://relay.lax1dude.net/" },
      { addr: "wss://relay.shhnowisnottheti.me/" }
    ]
  };

  /* ---------------------------------------------------------------
     Adaptive resolution. Deliberately conservative:
      - drops one step only after 4 s below 24 fps
        (menus are capped near 30 fps by the game, so they never trigger it)
      - rises one step only after 12 s at >= 50 fps
      - never climbs back to a level that already failed this session
      - 8 s cool-down after each change (a resize reallocates framebuffers)
     --------------------------------------------------------------- */
  var frames = 0, t0 = performance.now(), slow = 0, fast = 0, cool = 0, lastFps = 0;
  var hud = null;

  function apply(i) {
    idx = i; dpr = steps[i]; slow = fast = 0; cool = 8;
    try { localStorage.setItem("hzmc.dpr." + tier, String(dpr)); } catch (e) {}
    window.dispatchEvent(new Event("resize"));
  }

  function monitor(t) {
    frames++;
    if (t - t0 >= 1000) {
      lastFps = Math.round(frames * 1000 / (t - t0)); frames = 0; t0 = t;
      if (document.hidden || !isNaN(forced)) { slow = fast = 0; }
      else {
        if (lastFps < 24) { slow++; fast = 0; }
        else if (lastFps >= 50) { fast++; slow = 0; }
        else { slow = fast = 0; }
        if (cool > 0) cool--;
        else if (slow >= 4 && idx > 0) { apply(idx - 1); maxIdx = Math.min(maxIdx, idx); }
        else if (fast >= 12 && idx < maxIdx) { apply(idx + 1); }
      }
      if (hud) hud.textContent = lastFps + " fps | " + tier + " | scale " + dpr;
    }
    requestAnimationFrame(monitor);
  }

  window.addEventListener("load", function () {
    if (qs.has("hud")) {
      hud = document.createElement("div"); hud.id = "hzmc-hud"; document.body.appendChild(hud);
    }
    requestAnimationFrame(monitor);
  });

  // Block iOS pinch / double-tap zoom
  ["gesturestart", "gesturechange", "gestureend"].forEach(function (e) {
    document.addEventListener(e, function (ev) { ev.preventDefault(); });
  });

  window.__hzmc = { tier: tier, mobile: mobile, cores: cores, mem: mem, gpu: gpu, get dpr() { return dpr; } };
  console.log("[HZMC]", window.__hzmc);
})();
</script>

<script src="classes.js"></script>
</head>
<body id="game_frame">
<script>
"use strict";
window.addEventListener("load", function () {
  if (typeof main === "function") main();
  else document.body.textContent = "classes.js failed to load (main() missing). Check the Network tab.";
});
</script>
</body>
</html>
